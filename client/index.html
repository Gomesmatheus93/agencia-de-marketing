<!doctype html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Alle Energia</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7c00ae" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        const hasEndpoint = endpoint && !endpoint.includes("VITE_ANALYTICS_ENDPOINT");
        const hasWebsiteId = websiteId && !websiteId.includes("VITE_ANALYTICS_WEBSITE_ID");

        if (!hasEndpoint || !hasWebsiteId) return;

        const script = document.createElement("script");
        script.defer = true;
        script.src = `${endpoint.replace(/\/+$/, "")}/umami`;
        script.dataset.websiteId = websiteId;
        document.head.appendChild(script);
      })();
    </script>
  </body>

</html>
