<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350">
<!-- M42 · Card de número (fundo roxo): versão roxa do M39. Card branco para contrastar com o fundo; texto fora do card em branco. -->
<defs>
  <linearGradient id="roxo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A16A8"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c00ae"/><stop offset=".55" stop-color="#8f2fc4"/><stop offset="1" stop-color="#ffffff" stop-opacity=".0"/></linearGradient>
  <linearGradient id="cardH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A16A8"/><stop offset=".5" stop-color="#7c00ae" stop-opacity=".85"/><stop offset="1" stop-color="#5A16A8"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="contorno" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="grosso"/><feComposite in="grosso" in2="SourceAlpha" operator="out" result="linha"/><feFlood flood-color="#D9B8FF" flood-opacity="0.2"/><feComposite in2="linha" operator="in"/></filter><linearGradient id="canto" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d0b80"/><stop offset=".55" stop-color="#5A16A8"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
<filter id="sombraCard" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2E0A63" flood-opacity=".28"/></filter>  <linearGradient id="roxoBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="1350"><stop offset="0" stop-color="#2E0A63"/><stop offset=".55" stop-color="#4b1395"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
  <radialGradient id="brilhoBg" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#B98AE0" stop-opacity=".28"/><stop offset="1" stop-color="#B98AE0" stop-opacity="0"/></radialGradient>
  <linearGradient id="cantoLaranja" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa040"/><stop offset="1" stop-color="#ff5a00"/></linearGradient>
  <linearGradient id="rodapeRoxo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22074a"/><stop offset="1" stop-color="#3d0b80"/></linearGradient>
</defs>
<rect width="1080" height="1350" fill="url(#roxoBg)"/>
<rect width="1080" height="1350" fill="url(#brilhoBg)"/>
<!-- traçados do raio da Alle -->
<image href="alle:raio-mono" x="-260" y="230" width="820" height="1309" filter="url(#contorno)"/>
<image href="alle:raio-mono" x="520" y="-300" width="700" height="1117" filter="url(#contorno)"/>
<!-- forma em L (canto superior esquerdo) -->
<!-- canto: a parte de baixo do raio da Alle --><mask id="raioCantoE" maskUnits="userSpaceOnUse" x="-100" y="-400" width="700" height="900"><image href="alle:raio-mono" x="-55" y="-325" width="400" height="638"/></mask><rect x="-100" y="-400" width="700" height="900" fill="url(#cantoLaranja)" mask="url(#raioCantoE)" opacity=".88"/>
<!-- logos -->
<image href="alle:logo-branco" x="375" y="210" width="330" height="97"/>
<!-- card do número: contorno deslocado + card com sombra -->
<rect x="110" y="470" width="910" height="470" rx="52" fill="none" stroke="#ff7300" stroke-width="4" opacity=".7"/>
<rect x="70" y="420" width="910" height="470" rx="52" fill="#FFFFFF" filter="url(#sombraCard)"/>
<!-- seta -->
<path d="M140 560 L200 500 M165 500 H200 V535" fill="none" stroke="#ff7300" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text x="225" y="560" font-family="Montserrat" font-size="64" font-weight="400" fill="#3d0b80">Economize até</text>
<text x="130" y="770" font-family="Bebas Neue" font-size="250" fill="#7c00ae">35%</text>
<text x="505" y="685" font-family="Bebas Neue" font-size="96" fill="#ff7300">NA SUA CONTA</text>
<text x="505" y="770" font-family="Bebas Neue" font-size="96" fill="#ff7300">DE LUZ</text>
<text x="230" y="845" font-family="Montserrat" font-size="50" font-weight="800" fill="#3d0b80">com a Alle Energia!</text>
<path d="M230 868 H880" stroke="#ff7300" stroke-width="5" stroke-linecap="round"/>
<!-- leia a legenda e fechamento -->
<g><rect x="390" y="990" width="300" height="58" fill="none" stroke="#D9B8FF" stroke-width="3"/><text x="540" y="1030" font-family="Montserrat" font-size="28" font-weight="500" fill="#E9D7F7" text-anchor="middle" letter-spacing="1">LEIA A LEGENDA</text></g>
<text x="540" y="1200" font-family="Montserrat" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="9">FALE COM A ANE NO WHATSAPP</text>
<!-- rodapé -->
<rect x="0" y="1272" width="1080" height="78" fill="url(#rodapeRoxo)"/>
<rect x="0" y="1272" width="1080" height="5" fill="#ff7300"/>
<!-- Instagram e WhatsApp (ícones brancos) -->
<g><rect x="241" y="1296" width="34" height="34" rx="11" fill="none" stroke="#FFFFFF" stroke-width="3.6"/><circle cx="258" cy="1313" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="3.6"/><circle cx="267" cy="1304" r="2.6" fill="#FFFFFF"/><text x="289" y="1323" font-family="Montserrat" font-size="28" font-weight="600" fill="#FFFFFF">@alleenergia</text></g><g><path d="M554 1328 L551 1331 L552 1324 A17 17 0 1 1 558 1328 Z" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/><path d="M560 1305 q-3 0 -3 4 q1 8 13 14 q4 1 5 -2 l1 -3 l-5 -3 l-3 2 q-5 -2 -7 -7 l2 -3 l-3 -5 z" fill="#FFFFFF"/><text x="598" y="1323" font-family="Montserrat" font-size="28" font-weight="600" fill="#FFFFFF">(12) 95369-7411</text></g>
</svg>