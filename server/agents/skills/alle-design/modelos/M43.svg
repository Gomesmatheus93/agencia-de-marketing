<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350">
<!-- M43 · Manchete com objeto (fundo roxo): versão roxa do M40. Manchete em branco com destaque laranja; faixa de destaque em laranja. -->
<defs>
  <linearGradient id="roxo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A16A8"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c00ae"/><stop offset=".55" stop-color="#8f2fc4"/><stop offset="1" stop-color="#ffffff" stop-opacity=".0"/></linearGradient>
  <linearGradient id="cardH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A16A8"/><stop offset=".5" stop-color="#7c00ae" stop-opacity=".85"/><stop offset="1" stop-color="#5A16A8"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="contorno" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="grosso"/><feComposite in="grosso" in2="SourceAlpha" operator="out" result="linha"/><feFlood flood-color="#D9B8FF" flood-opacity="0.2"/><feComposite in2="linha" operator="in"/></filter><linearGradient id="canto" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d0b80"/><stop offset=".55" stop-color="#5A16A8"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
<filter id="sombraCard" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2E0A63" flood-opacity=".28"/></filter>  <linearGradient id="roxoBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1080" y2="1350"><stop offset="0" stop-color="#2E0A63"/><stop offset=".55" stop-color="#4b1395"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
  <radialGradient id="brilhoBg" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#B98AE0" stop-opacity=".28"/><stop offset="1" stop-color="#B98AE0" stop-opacity="0"/></radialGradient>
  <linearGradient id="cantoLaranja" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa040"/><stop offset="1" stop-color="#ff5a00"/></linearGradient>
  <linearGradient id="rodapeRoxo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22074a"/><stop offset="1" stop-color="#3d0b80"/></linearGradient>
</defs>
<rect width="1080" height="1350" fill="url(#roxoBg)"/>
<rect width="1080" height="1350" fill="url(#brilhoBg)"/>
<!-- traçados do raio da Alle -->
<image href="alle:raio-mono" x="-260" y="230" width="820" height="1309" filter="url(#contorno)"/>
<image href="alle:raio-mono" x="520" y="-300" width="700" height="1117" filter="url(#contorno)"/>
<!-- forma em L (canto superior direito) -->
<!-- canto: a parte de baixo do raio da Alle --><g transform="translate(1080 0) scale(-1 1)"><mask id="raioCantoD" maskUnits="userSpaceOnUse" x="-100" y="-400" width="700" height="900"><image href="alle:raio-mono" x="-55" y="-325" width="400" height="638"/></mask><rect x="-100" y="-400" width="700" height="900" fill="url(#cantoLaranja)" mask="url(#raioCantoD)" opacity=".88"/></g>
<!-- logos -->
<image href="alle:logo-branco" x="80" y="96" width="300" height="88"/>
<!-- manchete em 3 níveis -->
<text x="540" y="320" font-family="Bebas Neue" font-size="84" fill="#FFFFFF" text-anchor="middle">PAGUE MENOS NA CONTA DE LUZ</text>
<text x="540" y="425" font-family="Bebas Neue" font-size="104" fill="#ff7300" text-anchor="middle">SEM OBRA E SEM PLACA!</text>
<text x="540" y="492" font-family="Montserrat" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle">Com a Alle Energia, você garante</text>
<rect x="148" y="510" width="430" height="58" rx="8" fill="#ff7300"/>
<text x="363" y="551" font-family="Montserrat" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="middle">até 35% de desconto</text>
<text x="592" y="551" font-family="Montserrat" font-size="38" font-weight="800" fill="#FFFFFF">na conta de luz!</text>
<text x="540" y="640" font-family="Bebas Neue" font-size="78" fill="#FFFFFF" text-anchor="middle">TODOS OS MESES.</text>
<path d="M375 658 H705" stroke="#ff7300" stroke-width="5" stroke-linecap="round"/>
<g><rect x="390" y="690" width="300" height="58" fill="none" stroke="#D9B8FF" stroke-width="3"/><text x="540" y="730" font-family="Montserrat" font-size="28" font-weight="500" fill="#E9D7F7" text-anchor="middle" letter-spacing="1">LEIA A LEGENDA</text></g>
<!-- objeto: conta de luz com o gráfico subindo -->
<g transform="translate(0 30) rotate(-8 520 1000)">
  <path d="M210 830 Q520 790 830 840 L860 1180 Q540 1150 230 1200 Z" fill="#FFFFFF" stroke="#E4DAEE" stroke-width="3"/>
  <path d="M210 830 Q520 790 830 840 L860 1180 Q540 1150 230 1200 Z" fill="#3d0b80" opacity=".04"/>
  <text x="250" y="895" font-family="Bebas Neue" font-size="64" fill="#5A16A8" opacity=".85">CONTA DE LUZ</text>
  <rect x="250" y="915" width="300" height="12" rx="6" fill="#D8C9E8"/>
  <path d="M300 1120 H780 M300 1120 V950" stroke="#C9B8DA" stroke-width="4"/>
  <rect x="330" y="1080" width="52" height="40" rx="6" fill="#ff9a3c"/><rect x="400" y="1050" width="52" height="70" rx="6" fill="#ff8a1f"/>
  <rect x="470" y="1010" width="52" height="110" rx="6" fill="#ff7300"/><rect x="540" y="970" width="52" height="150" rx="6" fill="#ff7300"/>
  <rect x="610" y="925" width="52" height="195" rx="6" fill="#e86200"/>
  <path d="M330 1060 L420 1020 L500 1000 L580 950 L700 860" fill="none" stroke="#7c00ae" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M660 850 L712 852 L700 902" fill="none" stroke="#7c00ae" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <image href="alle:raio" x="720" y="1060" width="60" height="96"/>
</g>
<!-- rodapé -->
<rect x="0" y="1272" width="1080" height="78" fill="url(#rodapeRoxo)"/>
<rect x="0" y="1272" width="1080" height="5" fill="#ff7300"/>
