<!-- Fundo roxo da Alle (modelo M41, a versão roxa do M38 para contrastar com os posts brancos no perfil), editável:
     cole este conteúdo logo depois da tag <svg viewBox="0 0 1080 1350">, no lugar de <image href="alle:fundo-roxo">.
     Texto por cima: branco e laranja (nunca roxo-escuro). Em collab, apague o bloco "logo" e ponha os dois logos
     brancos lado a lado (alle:allpfit-branco + "+" + alle:logo-branco). -->
<defs>
  <linearGradient id="roxoBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E0A63"/><stop offset=".55" stop-color="#4b1395"/><stop offset="1" stop-color="#7c00ae"/></linearGradient>
  <radialGradient id="brilhoBg" cx=".5" cy=".42" r=".55"><stop offset="0" stop-color="#B98AE0" stop-opacity=".28"/><stop offset="1" stop-color="#B98AE0" stop-opacity="0"/></radialGradient>
  <linearGradient id="laranjaH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa040"/><stop offset="1" stop-color="#ff5a00"/></linearGradient>
  <linearGradient id="cardL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a00"/><stop offset=".5" stop-color="#ff8a1f" stop-opacity=".95"/><stop offset="1" stop-color="#ff5a00"/></linearGradient>
  <linearGradient id="fadeRoxo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d0b80" stop-opacity="0"/><stop offset="1" stop-color="#3d0b80"/></linearGradient>
  <linearGradient id="rodapeRoxo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22074a"/><stop offset="1" stop-color="#3d0b80"/></linearGradient>
<filter id="contornoClaro" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="grosso"/><feComposite in="grosso" in2="SourceAlpha" operator="out" result="linha"/><feFlood flood-color="#D9B8FF" flood-opacity="0.2"/><feComposite in2="linha" operator="in"/></filter></defs>
<rect width="1080" height="1350" fill="url(#roxoBg)"/>
<rect width="1080" height="1350" fill="url(#brilhoBg)"/>
<!-- traçados: contorno do raio da Alle, grande e discreto -->
<image href="alle:raio-mono" x="-260" y="230" width="820" height="1309" filter="url(#contornoClaro)"/>
<image href="alle:raio-mono" x="520" y="-300" width="700" height="1117" filter="url(#contornoClaro)"/>
<!-- faixa do topo -->
<rect x="50" y="-60" width="980" height="100" rx="44" fill="url(#laranjaH)"/>
<!-- logo -->
<image href="alle:logo-branco" x="375" y="80" width="330" height="97"/>
<!-- card do meio, atrás da pessoa (laranja, para a pessoa de roupa roxa se destacar) -->
<rect x="50" y="860" width="980" height="220" rx="44" fill="url(#cardL)"/>
<rect x="50" y="860" width="980" height="220" rx="44" fill="url(#fadeRoxo)" opacity=".35"/>
<!-- rodapé -->
<rect x="0" y="1272" width="1080" height="78" fill="url(#rodapeRoxo)"/>
<rect x="0" y="1272" width="1080" height="5" fill="#ff7300"/>
<!-- Instagram e WhatsApp (ícones brancos) -->
<g><rect x="241" y="1296" width="34" height="34" rx="11" fill="none" stroke="#FFFFFF" stroke-width="3.6"/><circle cx="258" cy="1313" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="3.6"/><circle cx="267" cy="1304" r="2.6" fill="#FFFFFF"/><text x="289" y="1323" font-family="Montserrat" font-size="28" font-weight="600" fill="#FFFFFF">@alleenergia</text></g><g><path d="M554 1328 L551 1331 L552 1324 A17 17 0 1 1 558 1328 Z" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/><path d="M560 1305 q-3 0 -3 4 q1 8 13 14 q4 1 5 -2 l1 -3 l-5 -3 l-3 2 q-5 -2 -7 -7 l2 -3 l-3 -5 z" fill="#FFFFFF"/><text x="598" y="1323" font-family="Montserrat" font-size="28" font-weight="600" fill="#FFFFFF">(12) 95369-7411</text></g>
