name: Deploy to Production

# Só manual: este código vive no mesmo repositório da KrythosLab (branch
# alle-energia), onde o segredo PORTAINER_WEBHOOK_URL aponta para a produção
# dela. Configure o webhook do servidor da Alle antes de automatizar o deploy.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Portainer Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger redeploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")
          echo "Portainer responded with HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "ERROR: Deploy failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Deploy triggered successfully"
